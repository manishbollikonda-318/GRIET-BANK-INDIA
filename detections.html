<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Air Tollgate Detections</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #0f172a; color: #e2e8f0; }
    .summary { display: flex; gap: 24px; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 16px 20px; border-radius: 10px; }
    .metric { font-size: 28px; font-weight: 700; color: #38bdf8; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; }
  </style>
</head>
<body>
  <h1>Live Airspace Toll Detections</h1>
  <div class="summary">
    <div class="card">
      <div>Total Toll Collected</div>
      <div class="metric" id="totalToll">0.00</div>
    </div>
    <div class="card">
      <div>Active Tracked Aircraft</div>
      <div class="metric" id="activeCount">0</div>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Time (UTC)</th>
        <th>Aircraft</th>
        <th>ICAO24</th>
        <th>Region</th>
        <th>Lat, Lon</th>
        <th>Alt (m)</th>
        <th>Toll Added</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    async function refreshDetections() {
      const res = await fetch('/api/detections');
      const data = await res.json();
      document.getElementById('totalToll').textContent = data.totalTollCollected.toFixed(2);
      document.getElementById('activeCount').textContent = data.activeTracked;

      const tbody = document.getElementById('rows');
      tbody.innerHTML = data.detections.map(d => `
        <tr>
          <td>${d.time}</td>
          <td>${d.callsign}</td>
          <td>${d.icao24}</td>
          <td>${d.regionName} (${d.region})</td>
          <td>${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}</td>
          <td>${d.alt}</td>
          <td>+${d.toll.toFixed(2)}</td>
        </tr>
      `).join('');
    }

    refreshDetections();
    setInterval(refreshDetections, 5000);
  </script>
</body>
</html>
